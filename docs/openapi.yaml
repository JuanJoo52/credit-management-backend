      type: object
      properties:
        installmentId:
          type: integer
          minimum: 1
        amount:
          type: number
          exclusiveMinimum: true
          minimum: 0
      required:
        - installmentId
        - amount
    PaymentResult:
      type: object
      properties:
        receipt:
          type: object
          properties:
            paymentId:
              type: integer
            paidAt:
              type: string
              format: date-time
            amountPaid:
              type: number
            installmentId:
              type: integer
            installmentNumber:
              type: integer
            totalInstallmentAmount:
              type: number
            paidAmount:
              type: number
            remainingBalance:
              type: number
            status:
              type: string
              enum:
                - Con abono
                - Pagada
          required:
            - paymentId
            - paidAt
            - amountPaid
            - installmentId
            - installmentNumber
            - totalInstallmentAmount
            - paidAmount
            - remainingBalance
            - status
      required:
        - receipt
