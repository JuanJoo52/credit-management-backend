          example: 1
  /customers:
    post:
      operationId: createCustomer
      summary: Registrar cliente
      tags:
        - Clientes
      description: "Solo verifyToken: no hay restricción RBAC adicional. CC/CE: 6–10 dígitos; PASSPORT: 6–12 alfanuméricos. Teléfono: 7–15 dígitos."
      security:
        - bearerAuth: []
      x-roles:
        - ADMIN
        - ADVISOR
        - CASHIER
      responses:
        "201":
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/Customer"
                required:
                  - message
                  - data
              example:
                message: Cliente registrado exitosamente
                data:
                  id: 1
                  documentType: CC
                  documentNumber: "1234567890"
                  firstName: Laura
                  lastName: Pérez
                  monthlyIncome: 3000000
                  address: "Calle 10 # 20-30"
                  phone: "3001234567"
                  createdAt: 2026-11-19T15:00:00.000Z
                  updatedAt: 2026-11-19T15:00:00.000Z
        "400":
          description: Validación o regla de negocio incumplida; JSON malformado.
          content:
