openapi: 3.0.3
info:
  title: Credit Management API
  version: 1.0.0
  description: API REST del Sistema de Gestion de Creditos. Base /api/v1. Incluye autenticacion JWT, administracion de personal y clientes, solicitudes, simulacion, evaluacion, desembolso y recaudo. Los ejemplos utilizan datos de demostracion. x-roles indica los roles autorizados; una lista vacia corresponde a una ruta publica.
servers:
  - url: https://credit-management-backend.vercel.app/api/v1
    description: "Produccion: Vercel y PostgreSQL en Supabase"
  - url: http://localhost:3000/api/v1
    description: Desarrollo local
tags:
  - name: Sistema
  - name: Autenticación
  - name: Usuarios
  - name: Clientes
  - name: Créditos
  - name: Recaudo
paths:
  /health:
    get:
      operationId: health
      summary: Estado de API
      tags:
        - Sistema
      description: No consulta la base de datos.
      security: []
      x-roles: []
      responses:
        "200":
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                required:
                  - status
              example:
                status: "API v1 is running "
  /auth/login:
    post:
      operationId: login
      summary: Iniciar sesión
      tags:
        - Autenticación
      description: JWT de 2 horas con userId y role. Todos los errores capturados por este controlador se convierten en 401.
      security: []
      x-roles: []
      responses:
        "200":
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      user:
                        $ref: "#/components/schemas/User"
                    required:
                      - token
                      - user
                required:
                  - success
                  - message
                  - data
              example:
                success: true
                message: Login exitoso
                data:
                  token: <JWT>
                  user:
                    id: 1
                    name: Ana Administradora
                    email: admin@example.com
                    role: ADMIN
                    status: ACTIVE
                    createdAt: 2026-11-19T15:00:00.000Z
        "400":
          description: Validación o regla de negocio incumplida; JSON malformado.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/MalformedJson"
              example:
                success: false
                message: Validación o regla de negocio incumplida; JSON malformado.
        "401":
          description: Token ausente, inválido o expirado; usuario inexistente/inactivo; credenciales inválidas en login.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                message: Token ausente, inválido o expirado; usuario inexistente/inactivo; credenciales inválidas en login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
                - email
                - password
            example:
              email: admin@example.com
              password: DemoPass123
  /auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Solicitar recuperación
      tags:
        - Autenticación
      description: Respuesta genérica para correo inexistente o inactivo; JWT de recuperación de 15 minutos. SMTP solo en NODE_ENV=production.
      security: []
      x-roles: []
      responses:
        "200":
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                required:
                  - success
                  - message
              example:
                success: true
                message: Si el correo se encuentra registrado, recibirás un enlace para restablecer tu contraseña.
        "400":
          description: Validación o regla de negocio incumplida; JSON malformado.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/MalformedJson"
              example:
                success: false
                message: Validación o regla de negocio incumplida; JSON malformado.
        "500":
          description: Error interno, persistencia o configuración.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                message: Error interno, persistencia o configuración.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
              required:
                - email
            example:
              email: admin@example.com
  /auth/reset-password:
    post:
      operationId: resetPassword
      summary: Restablecer contraseña
      tags:
        - Autenticación
      description: "Secreto dinámico JWT_SECRET + passwordHash: cambiar la contraseña invalida el enlace. La regla aquí es longitud mínima 8, distinta de alta de usuarios."
      security: []
      x-roles: []
      responses:
        "200":
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                required:
                  - success
                  - message
              example:
                success: true
                message: Contraseña restablecida exitosamente. Ya puedes iniciar sesión.
        "400":
          description: Validación o regla de negocio incumplida; JSON malformado.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/MalformedJson"
              example:
                success: false
                message: Validación o regla de negocio incumplida; JSON malformado.
        "500":
          description: Error interno, persistencia o configuración.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                message: Error interno, persistencia o configuración.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
              required:
                - token
                - newPassword
            example:
              token: <RESET_JWT>
              newPassword: NuevaPass123
  /users:
    post:
      operationId: createUser
      summary: Crear empleado
      tags:
        - Usuarios
      description: Crear empleado
      security:
        - bearerAuth: []
      x-roles:
        - ADMIN
      responses:
        "201":
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/User"
                required:
                  - success
                  - message
                  - data
              example:
                success: true
                message: User created successfully
                data:
                  id: 2
                  name: Carlos Cajero
                  email: cashier@example.com
                  role: CASHIER
                  status: ACTIVE
                  createdAt: 2026-11-19T15:00:00.000Z
        "400":
          description: Validación o regla de negocio incumplida; JSON malformado.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/MalformedJson"
              example:
                success: false
                message: Validación o regla de negocio incumplida; JSON malformado.
        "401":
          description: Token ausente, inválido o expirado; usuario inexistente/inactivo; credenciales inválidas en login.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                message: Token ausente, inválido o expirado; usuario inexistente/inactivo; credenciales inválidas en login.
        "403":
          description: Rol actual sin autorización.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                message: Rol actual sin autorización.
        "409":
          description: Correo o documento ya registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                message: Correo o documento ya registrado.
        "500":
          description: Error interno, persistencia o configuración.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                message: Error interno, persistencia o configuración.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
            example:
              name: Carlos Cajero
              email: cashier@example.com
              password: DemoPass123
              role: CASHIER
    get:
      operationId: listUsers
      summary: Listar empleados
      tags:
        - Usuarios
      description: Orden descendente por createdAt; sin paginación.
      security:
        - bearerAuth: []
      x-roles:
        - ADMIN
      responses:
        "200":
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                required:
                  - success
                  - data
              example:
                success: true
                data:
                  - id: 1
                    name: Ana Administradora
                    email: admin@example.com
                    role: ADMIN
                    status: ACTIVE
                    createdAt: 2026-11-19T15:00:00.000Z
        "401":
          description: Token ausente, inválido o expirado; usuario inexistente/inactivo; credenciales inválidas en login.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                message: Token ausente, inválido o expirado; usuario inexistente/inactivo; credenciales inválidas en login.
        "403":
          description: Rol actual sin autorización.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                message: Rol actual sin autorización.
        "500":
          description: Error interno, persistencia o configuración.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                message: Error interno, persistencia o configuración.
  /users/{id}:
