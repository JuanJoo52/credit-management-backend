                  id: 2
                  name: Carlos Cajero
                  email: admin@example.com
                  role: CASHIER
                  status: INACTIVE
                  createdAt: 2026-11-19T15:00:00.000Z
        "400":
          description: Validación o regla de negocio incumplida; JSON malformado.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/MalformedJson"
              example:
