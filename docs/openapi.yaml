    UserCreate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
          minLength: 8
          pattern: ^(?=.*[A-Z])(?=.*\d).{8,}$
        role:
          type: string
          enum:
            - ADMIN
            - ADVISOR
            - CASHIER
      required:
        - name
        - email
        - password
        - role
    UserUpdate:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
          enum:
            - ADMIN
            - ADVISOR
            - CASHIER
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
      minProperties: 1
    CustomerCreate:
      type: object
      properties:
        documentType:
          type: string
          enum:
            - CC
            - CE
            - PASSPORT
        documentNumber:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        monthlyIncome:
          type: number
        address:
          type: string
        phone:
          type: string
      required:
        - documentType
        - documentNumber
        - firstName
        - lastName
        - monthlyIncome
        - address
        - phone
    CustomerUpdate:
      type: object
      properties:
        monthlyIncome:
          type: number
          exclusiveMinimum: true
          minimum: 0
        address:
          type: string
        phone:
          type: string
          pattern: ^[0-9]{7,15}$
      minProperties: 1
      description: documentNumber y documentType se rechazan si aparecen. Otros campos se ignoran.
    CreditCreate:
      type: object
      properties:
        documentNumber:
          type: string
        amount:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 100000000
        termMonths:
          type: integer
          minimum: 1
          maximum: 72
        destination:
          type: string
      required:
        - documentNumber
        - amount
        - termMonths
        - destination
    CreditEvaluate:
      type: object
      properties:
        status:
          type: string
          enum:
            - APPROVED
            - REJECTED
        rejectionReason:
          type: string
      required:
        - status
    PublicCredit:
      type: object
      properties:
        documentType:
          type: string
          enum:
            - CC
            - CE
            - PASSPORT
        documentNumber:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        address:
          type: string
        monthlyIncome:
          type: number
          exclusiveMinimum: true
          minimum: 0
        amount:
          type: number
          minimum: 100000
          maximum: 100000000
        termMonths:
          type: integer
          minimum: 1
          maximum: 72
        destination:
          type: string
      required:
        - documentNumber
        - firstName
        - lastName
        - monthlyIncome
        - amount
        - termMonths
    SimulationInput:
      type: object
      properties:
        amount:
          type: number
          exclusiveMinimum: true
          minimum: 0
        termMonths:
          type: integer
          minimum: 1
          maximum: 72
      required:
        - amount
        - termMonths
    Simulation:
      type: object
      properties:
        amount:
          type: number
        termMonths:
          type: integer
        monthlyInterestRate:
          type: number
          example: 0.015
        monthlyInstallment:
          type: number
        totalInterest:
          type: number
        totalPayment:
          type: number
        schedule:
          type: array
          items:
            type: object
            properties:
              installmentNumber:
                type: integer
              payment:
                type: number
              interest:
                type: number
              principal:
                type: number
              remainingBalance:
                type: number
            required:
              - installmentNumber
              - payment
              - interest
              - principal
              - remainingBalance
      required:
        - amount
        - termMonths
        - monthlyInterestRate
        - monthlyInstallment
        - totalInterest
        - totalPayment
        - schedule
    Pending:
      type: object
      properties:
        customer:
          type: object
          properties:
            id:
              type: integer
            fullName:
              type: string
            documentNumber:
              type: string
          required:
            - id
            - fullName
            - documentNumber
        activeCredits:
          type: array
          items:
            type: object
            properties:
              creditRequestId:
                type: integer
              amount:
                type: number
              pendingInstallments:
                type: array
                items:
                  type: object
                  properties:
                    installmentId:
                      type: integer
                    installmentNumber:
                      type: integer
                    dueDate:
                      type: string
                      format: date-time
                    totalAmount:
                      type: number
                    paidAmount:
                      type: number
                    pendingBalance:
                      type: number
                    status:
                      type: string
                      enum:
                        - Pendiente
                        - Con abono
                        - Vencida
                  required:
                    - installmentId
                    - installmentNumber
                    - dueDate
                    - totalAmount
                    - paidAmount
                    - pendingBalance
                    - status
            required:
              - creditRequestId
              - amount
              - pendingInstallments
      required:
        - customer
        - activeCredits
