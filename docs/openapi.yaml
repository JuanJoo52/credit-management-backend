  /credits/simulate:
    post:
      operationId: simulateCredit
      summary: Simular amortización
      tags:
        - Créditos
      description: Sistema francés, tasa mensual fija 1.5%. Convierte amount y termMonths con Number; no impone el máximo de monto de creación.
      security: []
      x-roles: []
      responses:
        "200":
          description: Respuesta exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/Simulation"
                required:
                  - message
                  - data
              example:
                message: Simulación del plan de amortización realizada exitosamente
                data:
                  amount: 100000
                  termMonths: 1
                  monthlyInterestRate: 0.015
                  monthlyInstallment: 101500
                  totalInterest: 1500
                  totalPayment: 101500
                  schedule:
                    - installmentNumber: 1
                      payment: 101500
                      interest: 1500
                      principal: 100000
                      remainingBalance: 0
        "400":
          description: Validación o regla de negocio incumplida; JSON malformado.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/MalformedJson"
              example:
                success: false
                message: Validación o regla de negocio incumplida; JSON malformado.
        "500":
          description: Error interno, persistencia o configuración.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                message: Error interno, persistencia o configuración.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationInput"
            example:
              amount: 100000
              termMonths: 1
  /credits/public:
    post:
      operationId: createPublicCredit
      summary: Solicitar crédito público
      tags:
        - Créditos
      description: Crea cliente si no existe; si existe no modifica sus datos. documentType=CC, address=No registrada, phone vacío y destination=Libre inversión por defecto. Cliente y solicitud se crean sin transacción conjunta.
