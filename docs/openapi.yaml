components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de login válido por 2 horas. Se verifica existencia, estado ACTIVE y rol actual en BD.
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
      required:
        - success
        - message
    MalformedJson:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
      required:
        - status
        - message
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
            - ADMIN
            - ADVISOR
            - CASHIER
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - role
        - status
        - createdAt
    Customer:
      type: object
      properties:
        id:
          type: integer
        documentType:
          type: string
          enum:
            - CC
            - CE
            - PASSPORT
        documentNumber:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        monthlyIncome:
          type: number
        address:
          type: string
        phone:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - documentType
        - documentNumber
        - firstName
        - lastName
        - monthlyIncome
        - address
        - phone
        - createdAt
        - updatedAt
    Installment:
      type: object
      properties:
        id:
          type: integer
        installmentNumber:
          type: integer
        dueDate:
          type: string
          format: date-time
        principal:
          type: number
        interest:
          type: number
        paidAmount:
          type: number
        totalAmount:
          type: number
        status:
          type: string
          enum:
            - PENDING
            - PARTIAL
            - PAID
            - OVERDUE
        creditRequestId:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - installmentNumber
        - dueDate
        - principal
        - interest
        - paidAmount
        - totalAmount
        - status
        - creditRequestId
        - createdAt
        - updatedAt
    CreditCreated:
      type: object
      properties:
        id:
          type: integer
        amount:
          type: number
        termMonths:
          type: integer
        destination:
          type: string
        status:
          type: string
          enum:
            - PENDING
            - APPROVED
            - REJECTED
            - DISBURSED
        rejectionReason:
          type: string
          nullable: true
        customerId:
