                message: Error interno, persistencia o configuración.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerCreate"
            example:
              documentType: CC
              documentNumber: "1234567890"
              firstName: Laura
              lastName: Pérez
              monthlyIncome: 3000000
              address: "Calle 10 # 20-30"
              phone: "3001234567"
    get:
      operationId: listCustomers
      summary: Listar clientes
      tags:
        - Clientes
      description: Orden descendente por createdAt; sin paginación.
      security:
        - bearerAuth: []
      x-roles:
        - ADMIN
